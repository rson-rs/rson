[package]
name = "rson_rs"
version = "0.2.1"
resolver = "2"
edition = "2021"
license = "MIT"
keywords = ["parser", "serde", "serialization", "deserialization"]
authors = [
	"Aleksandr Meshcheriakov <freecoder.xx@gmail.com>",
]
description = "Rust Object Notation"
categories = ["encoding"]
homepage = "https://github.com/rson-rs/rson"
repository = "https://github.com/rson-rs/rson"
documentation = "https://docs.rs/rson_rs/"
exclude = ["bors.toml", ".travis.yml"]

[dependencies]
serde = "1"

[dev-dependencies]
serde_derive = "1"
serde_json = "1"
